[tool.poetry]
name = "assets-compass"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["all"], version = "^0.99.0"}
SQLAlchemy = "^2.0.31"
alembic = "^1.13.2"
psycopg2 = "^2.9.9"
fastapi-users = {extras = ["sqlalchemy"], version = "^13.0.0"}
asyncpg = "^0.29.0"
fastapi-cache2 = {extras = ["redis"], version = "^0.2.2"}
celery = "^5.4.0"
flower = "^2.0.1"
pytest = "^7.0.0"
pytest-asyncio = "*"
gunicorn = "^23.0.0"

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[build-system]
requires = ["poetry-core>=1.8.3"]
build-backend = "poetry.core.masonry.api"
